
name: Backup Git to Google Drive

on:
  push:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure OAuth2
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Create independent Git bundle
        run: |
          mkdir -p backup
          git bundle create backup/Infra-Nube.bundle --all
          git bundle verify backup/Infra-Nube.bundle

      - name: Upload backup to Google Drive
        env:
          FOLDER_ID: "1jP68pFf-XYG8jMn78bTDbomJ8X0OqmXj"
        run: |
          DATE=$(date -u +'%Y-%m-%d_%H-%M-%S')
          rclone copyto \
            backup/Infra-Nube.bundle \
            "gdrive:respaldos-git/Infra-Nube-${DATE}.bundle" \
            --drive-root-folder-id "$FOLDER_ID" \
            --retries 3
